name: build-pdf

on:
  push:
    branches:
      - main
      - 'book/**'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v1.0.0-beta.25
          call: calculus-made-easy pdf export --path=out/calculus-made-easy.pdf
      - if: github.event_name == 'workflow_dispatch'
        run: gh release create "$(date -u +%Y%m%d)-${GITHUB_SHA::7}" out/calculus-made-easy.pdf --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}