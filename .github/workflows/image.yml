name: image

on:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build -t ghcr.io/gorangrbic/calculus-made-easy:latest -f Containerfile .
      - run: docker push ghcr.io/gorangrbic/calculus-made-easy:latest
